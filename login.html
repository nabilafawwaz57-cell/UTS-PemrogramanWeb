<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookStore</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <section>
        <h1>BookStore</h1>
        <p>Selamat datang! Silakan login terlebih dahulu.</p>

        <form id="formLogin">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password">

            <button type="submit">Login</button>

        </form>

        <button type="button" id="lupaPassword">Lupa Password?</button>
        <button type="button" id="daftar">Daftar</button>
    </section>
       
    <div id="modalPopup" class="modal">

        <div class="modal-content">
            <span id="tutupModal" class="tutup">&times;</span>

            <h2 id="judulModal">Judul Popup</h2>

            <p id="isiModal">Isi popup akan muncul di sini.</p>

        </div>

    </div>
    
</main>

<script src="js/login.js"></script>

</body>
</html>
